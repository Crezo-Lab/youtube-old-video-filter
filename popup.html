<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<style>
  /* 色は役割ごと。明るい／暗いは prefers-color-scheme で切り替える（文字は WCAG AA 以上） */
  :root {
    color-scheme: light dark;
    --bg: #f6f6f3;
    --surface: #fcfcfb;
    --sunken: #ecece8;
    --line: #d6d6d0;
    --line-strong: #8a8a84;     /* 入力欄・チェックの輪郭（3:1 以上） */
    --text: #1b1b1a;
    --text-2: #5a5a56;
    --accent: #1b5fd1;          /* 押す・選ぶ・オンの色。差し色はこの1つだけ */
    --accent-text: #ffffff;
    --accent-weak: #e3ecfb;
    --warn: #8a4b00;
    --ok: #1c7a35;
    --off: #6f6f6a;
    --focus: #1b5fd1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414;
      --surface: #1d1d1d;
      --sunken: #262626;
      --line: #333333;
      --line-strong: #7d7d7d;
      --text: #ececec;
      --text-2: #a6a6a6;
      --accent: #6fa3ff;
      --accent-text: #0d1b33;
      --accent-weak: #1f2c45;
      --warn: #f0a24a;
      --ok: #4cc26a;
      --off: #8a8a8a;
      --focus: #8fb7ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Yu Gothic UI", Meiryo, "Helvetica Neue", Arial, sans-serif;
    width: 360px;
    margin: 0;
    padding: 12px 14px 14px;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    line-height: 1.45;
    user-select: none;
  }

  /* 見出し行 */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }
  .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .logo-badge {
    flex: none;
    background: var(--text);
    color: var(--bg);
    font-weight: 800;
    font-size: 11px;
    line-height: 1;
    padding: 5px 6px;
    border-radius: 4px;
    letter-spacing: 0.04em;
  }
  .brand-text { min-width: 0; }
  h1 {
    font-size: 14px;
    font-weight: 700;
    line-height: 1.3;
    margin: 0;
    overflow-wrap: anywhere;
  }
  .version-tag {
    display: block;
    font-size: 11px;
    color: var(--text-2);
    font-variant-numeric: tabular-nums;
  }
  .header-tools { flex: none; }

  /* 面（カード）: 全体で1段だけ。中にもう一段の枠は作らない */
  .switch-row, fieldset, .status-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
  }

  /* 状態（件数） */
  .status-card { padding: 8px 12px 10px; margin-bottom: 10px; }
  .status-header {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 20px;
  }
  .status-indicator {
    flex: none;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--ok);
  }
  .status-indicator.off { background: var(--off); }
  .status-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-2);
  }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    margin-top: 6px;
  }
  .stat-box { padding: 2px 8px; border-left: 1px solid var(--line); }
  .stat-box:first-child { padding-left: 0; border-left: 0; }
  .stat-num {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.2;
    font-variant-numeric: tabular-nums;
  }
  .stat-label {
    font-size: 11px;
    color: var(--text-2);
    overflow-wrap: anywhere;
  }
  .status-text-fallback {
    font-size: 12px;
    color: var(--text-2);
    margin-top: 2px;
  }

  /* メインスイッチ */
  .switch-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    min-height: 44px;
    padding: 6px 12px;
    margin-bottom: 10px;
  }
  .switch-label { font-size: 14px; font-weight: 700; }
  #enabled {
    appearance: none;
    -webkit-appearance: none;
    flex: none;
    position: relative;
    width: 48px;
    height: 32px;
    margin: 0;
    border-radius: 16px;
    background: var(--sunken);
    border: 1px solid var(--line-strong);
    cursor: pointer;
    transition: background 0.2s;
  }
  #enabled::after {
    content: "";
    position: absolute;
    top: 5px;
    left: 5px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--line-strong);
    transition: transform 0.2s, background 0.2s;
  }
  #enabled:checked { background: var(--accent); border-color: var(--accent); }
  #enabled:checked::after { transform: translateX(16px); background: var(--accent-text); }

  /* 設定のまとまり */
  fieldset {
    min-width: 0;
    padding: 8px 12px 10px;
    margin: 0 0 10px;
  }
  legend {
    float: left;            /* 枠線の切れ目に載せず、面の中の見出しにする */
    width: 100%;
    padding: 0;
    margin: 0 0 4px;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-2);
  }
  legend + * { clear: both; }
  .row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    min-height: 32px;
  }
  .row-target { margin-top: 6px; }

  input[type="number"], select, textarea {
    background: var(--bg);
    border: 1px solid var(--line-strong);
    color: var(--text);
    border-radius: 6px;
    font: inherit;
    font-size: 13px;
  }
  input[type="number"], select { height: 32px; padding: 0 8px; }
  input[type="number"] { font-variant-numeric: tabular-nums; }
  select { cursor: pointer; max-width: 100%; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  input[type="number"]:focus, select:focus, textarea:focus { border-color: var(--focus); }

  input[type="checkbox"]:not(#enabled) {
    flex: none;
    accent-color: var(--accent);
    cursor: pointer;
    width: 18px;
    height: 18px;
    margin: 0;
  }
  fieldset label {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px 8px;
    min-height: 32px;
    font-size: 13px;
    cursor: pointer;
  }
  /* 「視聴済み（[80]% 以上）」の数字と前後の字は隙間なくつなげる */
  label .pct { display: inline-flex; align-items: center; gap: 4px; }

  /* 適用するページ: 2列。長い訳語は折り返して崩さない */
  .pages-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    column-gap: 12px;
  }
  .pages-grid label { flex-wrap: nowrap; align-items: center; line-height: 1.3; padding: 3px 0; }

  textarea {
    display: block;
    width: 100%;
    height: 56px;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 12px;
    padding: 6px 8px;
    resize: vertical;
    user-select: text;
  }
  textarea::placeholder { color: var(--text-2); opacity: 1; }

  [hidden] { display: none !important; }
  .btn-quick {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    min-height: 32px;
    margin-top: 6px;
    padding: 6px 10px;
    background: var(--accent-weak);
    border: 1px solid var(--accent);
    color: var(--text);
    border-radius: 6px;
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.3;
    text-align: left;
    overflow-wrap: anywhere;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-quick:hover { background: var(--sunken); }
  .btn-block { background: transparent; border-color: var(--warn); }
  .btn-block:hover { background: var(--sunken); }
  .hint {
    font-size: 11px;
    color: var(--text-2);
    margin: 6px 0 0;
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span class="logo-badge">NY</span>
      <div class="brand-text">
        <h1 data-i18n="extName">YouTube 古い動画フィルター</h1>
        <span class="version-tag" id="appVersion">v1.2.1</span>
      </div>
    </div>
    <div class="header-tools">
      <select id="langSelect" aria-label="Language">
        <option value="auto">Auto</option>
        <option value="ja">日本語</option>
        <option value="en">English</option>
        <option value="zh_TW">繁體中文</option>
        <option value="zh_CN">简体中文</option>
        <option value="ko">한국어</option>
        <option value="es">Español</option>
      </select>
    </div>
  </div>

  <div class="switch-row">
    <label class="switch-label" for="enabled" data-i18n="filterEnabled">フィルター有効</label>
    <input type="checkbox" id="enabled">
  </div>

  <div class="status-card">
    <div class="status-header">
      <span class="status-indicator" id="statusIndicator"></span>
      <span class="status-title" data-i18n="statusTitle">このページで隠した数</span>
    </div>
    <div id="statsGrid" class="stats-grid" style="display: none;">
      <div class="stat-box">
        <div class="stat-num old" id="statOld">0</div>
        <div class="stat-label" data-i18n="oldVideos">古い動画</div>
      </div>
      <div class="stat-box">
        <div class="stat-num watched" id="statWatched">0</div>
        <div class="stat-label" data-i18n="statWatched">視聴済み</div>
      </div>
      <div class="stat-box">
        <div class="stat-num blocked" id="statBlocked">0</div>
        <div class="stat-label" data-i18n="statBlocked">ブロック</div>
      </div>
    </div>
    <div id="statusFallback" class="status-text-fallback">—</div>
  </div>

  <fieldset>
    <legend data-i18n="oldVideos">古い動画</legend>
    <div class="row">
      <input type="number" id="amount" min="1" max="999" style="width: 64px;">
      <select id="unit">
        <option value="day" data-i18n="unitDay">日</option>
        <option value="week" data-i18n="unitWeek">週間</option>
        <option value="month" data-i18n="unitMonth">か月</option>
        <option value="year" data-i18n="unitYear">年</option>
      </select>
      <span data-i18n="olderThan">以上前</span>
    </div>
    <div class="row row-target">
      <span data-i18n="targetVideos">対象の動画を</span>
      <select id="mode">
        <option value="hide" data-i18n="modeHide">非表示にする</option>
        <option value="dim" data-i18n="modeDim">薄く表示する</option>
      </select>
    </div>
  </fieldset>

  <fieldset>
    <legend data-i18n="otherFilters">その他のフィルター</legend>
    <label><input type="checkbox" id="hideWatched"> <span class="pct"><span data-i18n="hideWatchedPrefix">視聴済み（</span><input type="number" id="watchedPercent" min="1" max="100" style="width:56px"><span data-i18n="hideWatchedSuffix">% 以上）</span></span></label>
    <label><input type="checkbox" id="hideShorts"> <span data-i18n="hideShorts">Shorts を非表示</span></label>
  </fieldset>

  <fieldset>
    <legend data-i18n="targetPages">適用するページ</legend>
    <div class="pages-grid">
      <label><input type="checkbox" data-page="home"> <span data-i18n="pageHome">ホーム</span></label>
      <label><input type="checkbox" data-page="search"> <span data-i18n="pageSearch">検索結果</span></label>
      <label><input type="checkbox" data-page="watch"> <span data-i18n="pageWatch">再生画面の関連動画</span></label>
      <label><input type="checkbox" data-page="subscriptions"> <span data-i18n="pageSubscriptions">登録チャンネル</span></label>
      <label><input type="checkbox" data-page="channel"> <span data-i18n="pageChannel">チャンネルページ</span></label>
    </div>
  </fieldset>

  <fieldset>
    <legend data-i18n="allowChannelsLegend">古くても表示するチャンネル</legend>
    <textarea id="allowChannels" data-i18n-ph="channelPlaceholder" placeholder="@handle またはチャンネル名（1行に1つ）"></textarea>
    <button id="addCurrent" class="btn-quick" hidden></button>
    <p class="hint" data-i18n="channelHint">チャンネルページか再生画面で開くと追加ボタンが出ます</p>
  </fieldset>

  <fieldset>
    <legend data-i18n="blockChannelsLegend">常に非表示にするチャンネル（ブロック）</legend>
    <textarea id="blockChannels" data-i18n-ph="channelPlaceholder" placeholder="@handle またはチャンネル名（1行に1つ）"></textarea>
    <button id="blockCurrent" class="btn-quick btn-block" hidden></button>
  </fieldset>

  <script src="i18n-dict.js"></script>
  <script src="popup.js"></script>
</body>
</html>
