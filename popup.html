<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg-main: #0f0f0f;
    --bg-card: #1f1f1f;
    --border: #333333;
    --text-primary: #f1f1f1;
    --text-secondary: #aaaaaa;
    --accent: #ff0033;
    --accent-hover: #cc0029;
    --badge-bg: #272727;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    width: 310px;
    margin: 0;
    padding: 16px;
    background: var(--bg-main);
    color: var(--text-primary);
    box-sizing: border-box;
    user-select: none;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo-badge {
    background: var(--accent);
    color: #fff;
    font-weight: 800;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 4px;
    letter-spacing: 0.5px;
  }
  h1 {
    font-size: 13px;
    font-weight: 700;
    margin: 0;
    color: var(--text-primary);
  }
  .version-tag {
    font-size: 10px;
    color: var(--text-secondary);
    background: var(--badge-bg);
    padding: 2px 6px;
    border-radius: 10px;
    border: 1px solid var(--border);
    font-family: ui-monospace, monospace;
  }

  /* メインスイッチ */
  .switch-row {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .switch-label {
    font-size: 13px;
    font-weight: 600;
  }
  input[type="checkbox"] {
    accent-color: var(--accent);
    cursor: pointer;
    width: 16px;
    height: 16px;
  }

  /* セクション */
  fieldset {
    border: 1px solid var(--border);
    background: var(--bg-card);
    border-radius: 8px;
    padding: 10px 12px;
    margin: 0 0 10px;
  }
  legend {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    padding: 0 4px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .row:last-child {
    margin-bottom: 0;
  }
  input[type="number"], select {
    background: #121212;
    border: 1px solid var(--border);
    color: var(--text-primary);
    border-radius: 4px;
    padding: 4px 6px;
    font-size: 12px;
  }
  input[type="number"]:focus, select:focus, textarea:focus {
    outline: 1px solid var(--accent);
    border-color: var(--accent);
  }
  fieldset label {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 5px 0;
    font-size: 12px;
    cursor: pointer;
  }
  textarea {
    width: 100%;
    box-sizing: border-box;
    height: 52px;
    background: #121212;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-primary);
    font-size: 11px;
    font-family: ui-monospace, monospace;
    padding: 6px;
    resize: vertical;
  }
  .btn-quick {
    width: 100%;
    margin-top: 6px;
    padding: 6px 10px;
    background: #2a2a2a;
    border: 1px solid #444;
    color: #fff;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn-quick:hover {
    background: #383838;
  }
  .btn-block:hover {
    background: #4a1f24;
    border-color: #ff4d4d;
  }
  .hint {
    font-size: 10px;
    color: #888;
    margin: 4px 0 0;
  }

  /* ステータスカード（しっかりした表示） */
  .status-card {
    background: #161616;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 12px;
  }
  .status-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .status-title {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-secondary);
  }
  .status-indicator {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #2ba640;
  }
  .status-indicator.off {
    background: #888;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-top: 4px;
  }
  .stat-box {
    background: #202020;
    border-radius: 6px;
    padding: 6px 4px;
    text-align: center;
  }
  .stat-num {
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    line-height: 1.2;
  }
  .stat-num.old { color: #ff9800; }
  .stat-num.watched { color: #2196f3; }
  .stat-num.blocked { color: #f44336; }
  .stat-label {
    font-size: 9px;
    color: var(--text-secondary);
    margin-top: 2px;
  }
  .status-text-fallback {
    font-size: 11px;
    color: var(--text-secondary);
    line-height: 1.4;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span class="logo-badge">NY</span>
      <h1 data-i18n="extName">YouTube 古い動画フィルター</h1>
    </div>
    <div style="display: flex; align-items: center; gap: 6px;">
      <select id="langSelect" style="font-size: 10px; padding: 1px 4px; background: #202020; border: 1px solid var(--border); color: #ccc;">
        <option value="auto">🌐 Auto</option>
        <option value="ja">日本語</option>
        <option value="en">English</option>
        <option value="zh_TW">繁體中文</option>
        <option value="zh_CN">简体中文</option>
        <option value="ko">한국어</option>
        <option value="es">Español</option>
      </select>
      <span class="version-tag" id="appVersion">v1.2.1</span>
    </div>
  </div>

  <div class="switch-row">
    <span class="switch-label" data-i18n="filterEnabled">フィルター有効</span>
    <input type="checkbox" id="enabled">
  </div>

  <fieldset>
    <legend data-i18n="oldVideos">古い動画</legend>
    <div class="row">
      <input type="number" id="amount" min="1" max="999" style="width: 52px;">
      <select id="unit">
        <option value="day" data-i18n="unitDay">日</option>
        <option value="week" data-i18n="unitWeek">週間</option>
        <option value="month" data-i18n="unitMonth">か月</option>
        <option value="year" data-i18n="unitYear">年</option>
      </select>
      <span data-i18n="olderThan" style="font-size: 12px;">以上前</span>
    </div>
  </fieldset>

  <fieldset>
    <legend data-i18n="otherFilters">その他のフィルター</legend>
    <label><input type="checkbox" id="hideWatched"> <span data-i18n="hideWatchedPrefix">視聴済み（</span><input type="number" id="watchedPercent" min="1" max="100" style="width:40px"><span data-i18n="hideWatchedSuffix">% 以上）</span></label>
    <label><input type="checkbox" id="hideShorts"> <span data-i18n="hideShorts">Shorts を非表示</span></label>
  </fieldset>

  <div class="row" style="padding: 0 4px; margin-bottom: 10px;">
    <span data-i18n="targetVideos" style="font-size: 12px;">対象の動画を</span>
    <select id="mode">
      <option value="hide" data-i18n="modeHide">非表示にする</option>
      <option value="dim" data-i18n="modeDim">薄く表示する</option>
    </select>
  </div>

  <fieldset>
    <legend data-i18n="targetPages">適用するページ</legend>
    <label><input type="checkbox" data-page="home"> <span data-i18n="pageHome">ホーム</span></label>
    <label><input type="checkbox" data-page="search"> <span data-i18n="pageSearch">検索結果</span></label>
    <label><input type="checkbox" data-page="watch"> <span data-i18n="pageWatch">再生画面の関連動画</span></label>
    <label><input type="checkbox" data-page="subscriptions"> <span data-i18n="pageSubscriptions">登録チャンネル</span></label>
    <label><input type="checkbox" data-page="channel"> <span data-i18n="pageChannel">チャンネルページ</span></label>
  </fieldset>

  <fieldset>
    <legend data-i18n="allowChannelsLegend">古くても表示するチャンネル</legend>
    <textarea id="allowChannels" data-i18n-ph="channelPlaceholder" placeholder="@handle またはチャンネル名（1行に1つ）"></textarea>
    <button id="addCurrent" class="btn-quick" hidden></button>
    <p class="hint" data-i18n="channelHint">チャンネルページか再生画面で開くと追加ボタンが出ます</p>
  </fieldset>

  <fieldset>
    <legend data-i18n="blockChannelsLegend">常に非表示にするチャンネル（ブロック）</legend>
    <textarea id="blockChannels" data-i18n-ph="channelPlaceholder" placeholder="@handle またはチャンネル名（1行に1つ）"></textarea>
    <button id="blockCurrent" class="btn-quick btn-block" hidden></button>
  </fieldset>

  <!-- しっかりしたステータスカード -->
  <div class="status-card">
    <div class="status-header">
      <span class="status-title">Filtering Status</span>
      <span class="status-indicator" id="statusIndicator"></span>
    </div>
    <div id="statsGrid" class="stats-grid" style="display: none;">
      <div class="stat-box">
        <div class="stat-num old" id="statOld">0</div>
        <div class="stat-label">古い動画</div>
      </div>
      <div class="stat-box">
        <div class="stat-num watched" id="statWatched">0</div>
        <div class="stat-label">視聴済み</div>
      </div>
      <div class="stat-box">
        <div class="stat-num blocked" id="statBlocked">0</div>
        <div class="stat-label">ブロック</div>
      </div>
    </div>
    <div id="statusFallback" class="status-text-fallback">—</div>
  </div>

  <script src="i18n-dict.js"></script>
  <script src="popup.js"></script>
</body>
</html>
